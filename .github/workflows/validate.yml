name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
          # Two of HACS's checks are about the GitHub repository itself, not
          # about this code: it wants a repository description and topics.
          # Set both in the repository settings and delete this line - they
          # are required only for listing in the HACS default store, and an
          # install by custom repository works without them.
          ignore: topics description

  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install ruff
      - run: ruff check custom_components tests
      - run: ruff format --check custom_components

  tests:
    name: protocol tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements-test.txt
      - run: python scripts/check_services.py
      - run: python tests/test_protocol.py
      - run: python tests/test_diagnostics.py
      - run: python tests/test_rle.py
      - run: python tests/test_imaging.py
      - run: pytest tests/integration -q
