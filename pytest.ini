[pytest]
asyncio_mode = auto
# Make `custom_components` importable no matter how pytest is started.
# `python -m pytest` puts the working directory on sys.path and a bare
# `pytest` does not, which is exactly how the suite passed locally and
# failed in CI with "No module named 'custom_components'".
pythonpath = .
testpaths = tests
norecursedirs = .git
