set_rgb:
  fields:
    device_id:
      required: true
      selector:
        device:
          filter:
            - integration: esl_zhsunyco
    rgb_color:
      required: true
      example: "[255, 0, 0]"
      selector:
        color_rgb:
    on_ms:
      required: false
      example: 500
      selector:
        number:
          min: 0
          max: 65535
          unit_of_measurement: ms
          mode: box
    off_ms:
      required: false
      example: 500
      selector:
        number:
          min: 0
          max: 65535
          unit_of_measurement: ms
          mode: box
    work_ms:
      required: false
      example: 30000
      selector:
        number:
          min: 0
          max: 86400000
          unit_of_measurement: ms
          mode: box

clear_screen:
  fields:
    device_id:
      required: true
      selector:
        device:
          filter:
            - integration: esl_zhsunyco

set_image:
  fields:
    device_id:
      required: true
      selector:
        device:
          filter:
            - integration: esl_zhsunyco
    path:
      required: true
      example: /config/www/label.png
      selector:
        text:
    encoding:
      required: false
      default: auto
      selector:
        select:
          options: [auto, mono, bwry_packed, bwry_planes]
    bit_order:
      required: false
      default: msb
      selector:
        select:
          options: [msb, lsb]
    rotate:
      required: false
      default: 0
      selector:
        select:
          options: ["0", "90", "180", "270"]
    mirror:
      required: false
      default: false
      selector:
        boolean:
    invert:
      required: false
      default: false
      selector:
        boolean:
    dither:
      required: false
      default: true
      selector:
        boolean:

debug_probe:
  fields:
    device_id:
      required: true
      selector:
        device:
          filter:
            - integration: esl_zhsunyco

debug_command:
  fields:
    device_id:
      required: true
      selector:
        device:
          filter:
            - integration: esl_zhsunyco
    payload:
      required: true
      example: "a5 04"
      selector:
        text:
    expect_response:
      required: false
      default: true
      selector:
        boolean:

send_test_pattern:
  fields:
    device_id:
      required: true
      selector:
        device:
          filter:
            - integration: esl_zhsunyco
    pattern:
      required: false
      default: diagnostic
      selector:
        select:
          options:
            - diagnostic
            - solid_black
            - solid_white
            - solid_red
            - solid_yellow
            - stripes_h
            - stripes_v
            - checkerboard
            - quadrants
    encoding:
      required: false
      default: auto
      selector:
        select:
          options: [auto, mono, bwry_packed, bwry_planes]
    bit_order:
      required: false
      default: msb
      selector:
        select:
          options: [msb, lsb]
    rotate:
      required: false
      default: 0
      selector:
        select:
          options: ["0", "90", "180", "270"]
    mirror:
      required: false
      default: false
      selector:
        boolean:
    invert:
      required: false
      default: false
      selector:
        boolean:
    dither:
      required: false
      default: true
      selector:
        boolean:

debug_command_sweep:
  fields:
    device_id:
      required: true
      selector:
        device:
          filter:
            - integration: esl_zhsunyco
    preset:
      required: false
      default: clear_screen
      selector:
        select:
          options: [clear_screen, opcode]
    opcode:
      required: false
      default: "A504"
      example: "A504"
      selector:
        text:
    payloads:
      required: false
      example: '["a5 04", "04 a5"]'
      selector:
        object:
    settle:
      required: false
      default: 1.5
      selector:
        number:
          min: 0.1
          max: 10
          step: 0.1
          unit_of_measurement: s
