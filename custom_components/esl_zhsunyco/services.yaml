set_rgb:
  target:
    device:
      integration: esl_zhsunyco
  fields:
    rgb_color:
      required: true
      example: "[255, 0, 0]"
      selector:
        color_rgb:
    on_ms:
      required: false
      example: 500
      selector:
        number:
          min: 0
          max: 65535
          unit_of_measurement: ms
          mode: box
    off_ms:
      required: false
      example: 500
      selector:
        number:
          min: 0
          max: 65535
          unit_of_measurement: ms
          mode: box
    work_ms:
      required: false
      example: 30000
      selector:
        number:
          min: 0
          max: 86400000
          unit_of_measurement: ms
          mode: box

clear_screen:
  target:
    device:
      integration: esl_zhsunyco

set_image:
  target:
    device:
      integration: esl_zhsunyco
  fields:
    path:
      required: true
      example: /config/www/label.png
      selector:
        text:
    encoding:
      required: false
      default: auto
      selector:
        select:
          options: [auto, mono, bwry_packed, bwry_planes]
    bit_order:
      required: false
      default: msb
      selector:
        select:
          options: [msb, lsb]
    rotate:
      required: false
      default: 0
      selector:
        select:
          options: ["0", "90", "180", "270"]
    mirror:
      required: false
      default: false
      selector:
        boolean:
    invert:
      required: false
      default: false
      selector:
        boolean:
    dither:
      required: false
      default: true
      selector:
        boolean:

debug_probe:
  target:
    device:
      integration: esl_zhsunyco

debug_command:
  target:
    device:
      integration: esl_zhsunyco
  fields:
    payload:
      required: true
      example: "a5 04"
      selector:
        text:
    expect_response:
      required: false
      default: true
      selector:
        boolean:

send_test_pattern:
  target:
    device:
      integration: esl_zhsunyco
  fields:
    pattern:
      required: false
      default: diagnostic
      selector:
        select:
          options:
            - diagnostic
            - solid_black
            - solid_white
            - solid_red
            - solid_yellow
            - stripes_h
            - stripes_v
            - checkerboard
            - quadrants
    encoding:
      required: false
      default: auto
      selector:
        select:
          options: [auto, mono, bwry_packed, bwry_planes]
    bit_order:
      required: false
      default: msb
      selector:
        select:
          options: [msb, lsb]
    rotate:
      required: false
      default: 0
      selector:
        select:
          options: ["0", "90", "180", "270"]
    mirror:
      required: false
      default: false
      selector:
        boolean:
    invert:
      required: false
      default: false
      selector:
        boolean:
    dither:
      required: false
      default: true
      selector:
        boolean:
