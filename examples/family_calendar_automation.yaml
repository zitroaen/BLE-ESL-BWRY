# Wann der Kalender ans ESL geht.
#
# Einfach alle 15 Minuten, plus einmal beim Start von Home Assistant.
# Das deckt alles ab: den Tageswechsel, einen verschobenen Termin, einen
# neuen Eintrag, eine korrigierte Abfuhr.
#
# Das geht nur deshalb, weil die Integration eine Uebertragung
# ueberspringt, die nichts aendern wuerde: gezeichnet wird jedes Mal,
# gesendet nur, wenn das Bild sich vom zuletzt gesendeten unterscheidet.
# Zeichnen kostet 100 ms, Senden kostet Akku und macht das Label
# waehrenddessen fuer Bluetooth unsichtbar.
#
# Darum darf das Skript auch keine "aktualisiert HH:MM"-Zeile zeichnen -
# die waere jede Minute anders und wuerde jedes Mal eine Uebertragung
# ausloesen.
#
# Soll ein Bild in jedem Fall raus, etwa nach einem Batteriewechsel:
# force: true an der drawcustom-Aktion.

alias: Kalender an ESL senden
description: Zeichnet alle 15 Minuten; gesendet wird nur, was anders ist.
triggers:
  - trigger: time_pattern
    minutes: "/15"
  - trigger: homeassistant
    event: start
conditions: []
actions:
  - action: script.esl_familienkalender
mode: single
max_exceeded: silent
